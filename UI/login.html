<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录</title>
</head>
<body>
    <h1>登录</h1>
    <form action="/login" method="post">
        <label>用户名：<input type="text" name="username" autocomplete="username" minlength="3" maxlength="32" required></label><br>
        <label>密码：<input type="password" name="password" autocomplete="current-password" minlength="12" maxlength="128" required></label><br>
        <input type="submit" value="登录">
    </form>
    <p><a href="/register">创建账号</a></p>
</body>
</html>
