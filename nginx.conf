events {
    worker_connections 1024;
}
http {
    upstream app {
        server 127.0.0.1:8080;
    }
    server {
        listen 80;
        client_max_body_size 2m;
        location / {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection close;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache off;
        }
    }
}
